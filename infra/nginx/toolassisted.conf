# toolassisted.run — the site itself, served from the archivist's freshest
# build: /opt/archivist/site/current swaps atomically about a second after
# any content lands.
#
# NOT a file to copy into place. certbot rewrote this vhost in its own shape
# on 2026-10-06: live, the apex and www share one server block, the TLS
# directives and the HTTP-to-HTTPS redirect server are certbot's, and the
# redirect server carries a second, unreachable copy of the locations below.
# This file is the record of OUR directives, applied to
# /etc/nginx/sites-available/ one directive at a time and then `nginx -t`
# and `systemctl reload nginx`. Nothing in the deploy installs it, and
# copying it over the live file would drop certbot's TLS and break HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name toolassisted.run;

    root /opt/archivist/site/current;
    index index.html;
    error_page 404 /404.html;

    # freshness is the whole point of serving from here: every response
    # revalidates (the ETag makes that a 304 nearly always), so a build
    # swap is visible on the very next page load
    add_header Cache-Control "no-cache";

    include snippets/tar-hardening.conf;

    location / {
        limit_req zone=tarpages burst=80 nodelay;
        limit_req_status 429;
        try_files $uri $uri/ =404;
    }

    # the API on the site's own origin, so submits and visit pings need no
    # CORS preflight; forum.toolassisted.run/archivist/ keeps working too
    location /archivist/ {
        limit_req zone=tarapi burst=20 nodelay;   # zones: conf.d/tar-ratelimit.conf
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100/;
        proxy_ssl_verify off;      # the archivist's own cert is self-signed
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 120m;
        # A movie may be 100 MB (the validator's ceiling, which is GitHub's
        # hard blob limit), and a submission carries screenshots and notes
        # beside it: 108.8 MB at the most, so 120m leaves room for the
        # multipart framing. The reply waits on the commit and the push of
        # that blob to GitHub, which outruns the default 60s read timeout;
        # without the raise nginx answers 504 on a write that succeeded.
        proxy_read_timeout 300s;
    }
}

# www is not a second site. One canonical host, and a reader who typed www
# lands on it: the pages link to the apex, the session cookie and the
# archivist's CORS answers are the apex's, and two live hostnames for one
# site is two things to keep true. Certbot's certificate already covers both
# names, so this block only redirects.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.toolassisted.run;

    ssl_certificate /etc/letsencrypt/live/toolassisted.run/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toolassisted.run/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://toolassisted.run$request_uri;
}
