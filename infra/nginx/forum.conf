# forum.toolassisted.run — Discourse in socketed mode: the container no
# longer binds 80/443; this host terminates TLS and proxies to its unix
# socket.
#
# INSTALLED BY THE DEPLOY. tar-site-sync copies this to
# /etc/nginx/sites-available/forum.conf, runs `nginx -t`, puts the
# previous file back if the test fails, and reloads only when something
# changed. This
# file is therefore the live configuration, certbot's own directives
# included: they are here because the file has to be installable, not
# because we maintain them. `certbot renew` replaces certificate files and
# does not rewrite a vhost, but a `certbot --nginx` reconfiguration would,
# and whatever it writes has to be committed back here or the next deploy
# will quietly undo it.
#
# The contents below are what was live on 2026-10-09, adopted as they stood
# rather than tidied, so that turning the deploy on changed nothing. certbot
# left one piece of litter worth removing on purpose some day: its port-80
# block is a whole copy of the server above, and because every request to it
# matches one of its `if ($host = ...)` redirects, none of that copy is ever
# reached.
server {
    server_name forum.toolassisted.run;

    location / {
        proxy_pass http://unix:/var/discourse/shared/standalone/nginx.http.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 40m;
    }

    # the address every deployed page's window.TAR.api points at
    location /archivist/ {
        limit_req zone=tarapi burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 120m;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/forum.toolassisted.run/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/forum.toolassisted.run/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = forum.toolassisted.run) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name forum.toolassisted.run;
    return 404; # managed by Certbot


}
