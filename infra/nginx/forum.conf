# forum.toolassisted.run — Discourse in socketed mode: the container no
# longer binds 80/443; this host terminates TLS and proxies to its unix
# socket.
#
# NOT a file to copy into place, for the same reason as toolassisted.conf:
# certbot rewrote the live vhost on 2026-10-06 and owns the TLS directives
# and the redirect server there. This file is the record of OUR directives,
# applied one at a time and then `nginx -t` and `systemctl reload nginx`.
server {
    listen 80;
    listen [::]:80;
    server_name forum.toolassisted.run;

    location / {
        proxy_pass http://unix:/var/discourse/shared/standalone/nginx.http.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        client_max_body_size 40m;
    }

    # the address every deployed page's window.TAR.api points at
    location /archivist/ {
        limit_req zone=tarapi burst=20 nodelay;   # zones: conf.d/tar-ratelimit.conf
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 120m;
        # A movie may be 100 MB (the validator's ceiling, which is GitHub's
        # hard blob limit), and a submission carries screenshots and notes
        # beside it: 108.8 MB at the most, so 120m leaves room for the
        # multipart framing. The reply waits on the commit and the push of
        # that blob to GitHub, which outruns the default 60s read timeout;
        # without the raise nginx answers 504 on a write that succeeded.
        proxy_read_timeout 300s;
    }
}
