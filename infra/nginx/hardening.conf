# The browser-side hardening a static site can carry without a full CSP
# (inline scripts and third-party embeds make one impractical here): never
# sniffed, never framed, no plugins, no <base> hijack, referrers trimmed.
# Installed as /etc/nginx/snippets/tar-hardening.conf and included by both
# server blocks of toolassisted.conf (certbot's 443 twin carries its own HSTS).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
