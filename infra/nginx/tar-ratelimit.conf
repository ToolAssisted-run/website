# Per-IP backstop for archivist write endpoints: the app paces per member,
# this paces per address (Cloudflare real IP via the realip snippet).
limit_req_zone $binary_remote_addr zone=tarapi:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=tarpages:10m rate=30r/s;

# How long archivist requests take, and nothing about who made them: no
# address, no query string, no referrer. Read to see what a write costs a
# member (forum.conf, location /archivist/).
log_format tar_timed '$time_iso8601 $request_method $uri $status '
                     'request=$request_time upstream=$upstream_response_time';
