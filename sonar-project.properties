# SonarQube project definition for local scanning (see tools/sonar.sh).
sonar.projectKey=toolassisted-run-website
sonar.projectName=toolAssisted.run website
sonar.sourceEncoding=UTF-8

# Backend (Python: the generator and the archivist) and frontend (JS/CSS).
sonar.sources=generator,archivist,assets
sonar.tests=tests
sonar.python.version=3.12

# Generated/output and third-party trees never count against the code.
sonar.exclusions=stage-build/**,site-build/**,**/__pycache__/**,mockups/**
